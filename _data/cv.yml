    Experience:
      - company: Boston University School of Public Health
        position: Research Analyst
        location: Boston, MA
        start_date: 2023-08
        end_date: 2025-08
        highlights:
          - Updated and maintained the Co-Benefits of the Built Environment (CoBE) tool and assisted with development of future versions and modules added to the CoBE toolbox.
          - Designed novel experiments run through the CoBE tool and assisted in the writing of papers intended for submission for the peer-reviewed literature.
          - Reported and presented findings to outside stakeholders, including funders, policymakers, building owners, investors, and other stakeholders.
          - Collected, cataloged, and QA/QC energy infrastructure and population health data.
          - Used GIS analytical techniques to assess siting patterns of energy infrastructure.
          - Developed exposure indices based on energy infrastructure data and data on emissions, use intensity, or other variables that serve as a proxy for intensity of use.
          - Reported results and participated in workshops for the research community at BUSPH and the Institute for Global Sustainability at Boston University.

      - company: Harvard T.H. Chan School of Public Health
        position: Research Assistant
        location: Boston, MA
        start_date: 2022-05
        end_date: 2023-07
        highlights:
          - Managed the CoBE Tool, a web-based tool to aid in understanding the climate and health impacts of the energy consumption of buildings.
          - Assisted in updating the CoBE Tool and developing new tools and features.
          - Conducted modeling and analysis for ongoing co-benefits research projects.
          - Led independent research projects and presented findings at conferences.
          - Developed case studies using the CoBE Tool and co-authored papers reporting findings.

      - company: REsurety, Inc.
        position: Risk and Transaction Analyst
        location: Boston, MA
        start_date: 2021-01
        end_date: 2022-04
        highlights:
          - Settled hedging contracts for renewable energy projects by cleaning, and analyzing raw site data using R.
          - Evaluated renewable energy contracts for utility scale projects using meteorological and electricity market data.
          - Worked with other analysts to execute quality control checks on data critical to business processes.

      - company: National Renewable Energy Laboratory
        position: Research Intern
        location: Golden, CO
        start_date: 2020-08
        end_date: 2020-12
        highlights:
          - Collected, parsed, and cleaned hourly emissions data for natural gas power plants in order to analyze nitrogen oxide to describe their emissions profiles empirically and statistically during categorized non-steady state conditions.
          - Applied k-means and gaussian mixture model clustering algorithms using python to differentiate steady and non-steady state power plant emission rates.
          - Designed and presented a research poster summarizing the project findings.

      - company: Center for Climate, Health, and The Global Environment
        position: Research Assistant
        location: Boston, MA
        start_date: 2020-02
        end_date: 2020-08
        highlights:
          - Built a program in python to plot and test the reported emission rates by the EPA of SO2, CO2, and NOX from multiple types of power plants in the Northeast.
          - Ran simulations using GridPIQ and AVERT programs in order to test the difference in emissions of different charging scenarios for electric vehicles in regions throughout the US.
          - Compared the emissions for multiple electric vehicles charging scenarios with the corresponding reduction in emissions from the removal of fossil fuel powered vehicles to estimate the total bounce back in emissions.

      - company: Nexamp, Inc
        position: Solar Design Engineering Intern
        location: Boston, MA
        start_date: 2019-06
        end_date: 2019-12
        highlights:
          - Designed site plans for potential solar projects in AutoCAD, Helios, and Helioscope, while considering local and national standards for offsets and design limitations.
          - Performed energy model simulations in PVSyst in order to analyze the capacity factor of projects and the losses due to shading and stringing.
          - Worked with Design and Power Engineers to update later stage project designs based on updated drawings.

